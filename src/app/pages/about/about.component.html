<app-header class="no-print"></app-header>

<!-- The pyramid. PyramidScene fills this with the frost, the canvas and the
     label layer; drag turns it, the wheel or a pinch zooms, arrow keys step
     face to face. -->
<div
  #stage
  class="kp-stage"
  tabindex="0"
  role="group"
  aria-label="how kelly makes sense of things — drag or use the arrow keys to turn it, scroll or pinch to zoom, and choose a word to trace it back"
>
  <!-- The sentence is drawn by the scene, under each face's thing. This is
       the same sentence for screen readers only, read out as it changes. -->
  <p class="kp-spoken" aria-live="polite">
    {{ subject() }}{{ ending() ? ', ' + ending()!.text : '' }}
  </p>
</div>
