<!-- The photograph is the site's ground: fixed, full-bleed, behind every page.
     `fit` is an attribute because it's this page's decision, not the photo's;
     the framing that keeps every marked surface inside the frame — the crop, the
     object-position, and which surfaces are projected, floated or dropped — is
     art direction, so it lives in the manifest's `variants` (author it in the
     library editor's Screens mode, which round-trips them). -->
<image-surface
  class="photo"
  manifest="opportunities.surfaces.json"
  fit="cover"
  (image-surface-layout)="onLayout($event)"
  (image-surface-error)="onError($event)"
>
  @if (live()) {
    <!-- The laptop screen: the biggest surface, and a screen, so it takes the
         introduction, the code, and the link off to the rest. -->
    <div
      class="surface-laptop"
      [class.is-floating]="floating().has('laptop')"
      [class.glass-edge]="floating().has('laptop')"
      [class.glass-dark]="floating().has('laptop')"
      slot="laptop"
    >
      <!-- The name itself is the way in: "Kelly" is the link, the greeting
           around it is not. Same swept treatment as the links below it. -->
      <!-- A hint under the name says so, since a name doesn't look like a
           button. It's outside the link (.glow-sweep would paint it as one) and
           hidden from screen readers, which already announce the link. Only
           here when floated: projected, it's drawn upright in front of the
           screen instead (see .name-hint below the photo). -->
      <h2 class="laptop-hello">
        Hello, I'm
        <span class="laptop-name-wrap">
          <a
            #laptopName
            glowSweep
            class="glow-sweep laptop-name"
            routerLink="/about"
            >Kelly</a
          >
          @if (floating().has('laptop')) {
            <span class="laptop-name-hint" aria-hidden="true"
              >(click for 'about')</span
            >
          }
        </span>
      </h2>
      <!-- Each icon sits outside its link: .glow-sweep clips its background to
           the glyphs and blanks the text fill, which would swallow an icon
           inside it. Solid icon, swept words — the same split as the glow
           buttons. The rows are left-aligned inside a centred column so the two
           icons line up with each other. -->
      <div class="laptop-links">
        <div class="laptop-link-row">
          <i class="pi pi-github laptop-icon" aria-hidden="true"></i>
          <a
            glowSweep
            class="glow-sweep laptop-link"
            href="https://github.com/kneuroth"
            target="_blank"
            rel="noopener noreferrer"
            >github.com/kneuroth</a
          >
        </div>
        <div class="laptop-link-row">
          <i class="pi pi-envelope laptop-icon" aria-hidden="true"></i>
          <!-- No target=_blank: a mailto handing off to a mail client should not
               also leave an empty tab behind. -->
          <a
            glowSweep
            class="glow-sweep laptop-link"
            href="mailto:kelly.neuroth@outlook.com"
            >kelly.neuroth&#64;outlook.com</a
          >
        </div>
      </div>
    </div>

    <!-- The cube: two faces and a word, one object. `data-group` is what relates
         them — they're separate surfaces, so the only thing they share is the
         photo, and `:has()` on it lights the whole group from any one of them.
         The faces are decorative duplicates so a click anywhere on the cube
         works; the label is the real link, and its text is its accessible name. -->
    <a
      class="cube-face"
      data-group="cube"
      slot="cube-teal"
      routerLink="/portfolio"
      aria-hidden="true"
      tabindex="-1"
      ><span class="surface-lit" style="--face: #0d8a8a"></span
    ></a>
    <a
      class="cube-face"
      data-group="cube"
      slot="cube-red"
      routerLink="/portfolio"
      aria-hidden="true"
      tabindex="-1"
      ><span class="surface-lit" style="--face: #c41e3a"></span
    ></a>
    <a
      class="surface-label"
      data-group="cube"
      slot="cube-label"
      routerLink="/portfolio"
      ><span glowSweep class="glow-sweep label-text">portfolio</span></a
    >

    <!-- The notebook: the same object-and-a-word pattern as the cube, and a
         link the same way — the page is a decorative duplicate so a click
         anywhere on it works, and the label is the real link. Its light is grey
         rather than a colour of its own: lit, so it's plainly part of the desk,
         but dull, because the blog behind it is still empty. -->
    <a
      class="notebook-face"
      data-group="notebook"
      slot="notebook"
      routerLink="/blog"
      aria-hidden="true"
      tabindex="-1"
      ><span
        class="surface-lit"
        style="--face: #55555c; --lit-opacity: 0.55; --lit-rest: 0.75"
      ></span
    ></a>

    <!-- The label is two different things depending on where it lands, so it is
         two elements rather than one wearing a costume.

         Projected, it hovers over the notebook: a bare drifting word, because
         the object underneath it is the thing you are looking at and a slab
         would bury it.

         Floated, there is no notebook — the manifest drops it — so the word
         would be a caption on open photograph with nothing to belong to. There
         it becomes a glass button: an object in its own right, which is exactly
         what the small screen took away. -->
    @if (floating().has('notebook-label')) {
      <!-- Dark tone: out here the veil is lifted and the ground is the
           photograph, so white frost would vanish into the bright sill. -->
      <app-glass-button
        class="notebook-button"
        slot="notebook-label"
        tone="dark"
        link="/blog"
        ><span glowSweep class="glow-sweep glow-sweep-pending"
          >blog</span
        ></app-glass-button
      >
    } @else {
      <!-- Pending: the blog is a real link but has nothing in it yet, so the
           word sweeps grey, the wrong way (see .glow-sweep-pending). -->
      <a
        class="surface-label"
        data-group="notebook"
        slot="notebook-label"
        routerLink="/blog"
        ><span glowSweep class="glow-sweep glow-sweep-pending label-text"
          >blog</span
        ></a
      >
    }
  }
</image-surface>

<!-- The name hint while the laptop is projected: in the desk's flat layer, not
     on the tilted screen, so it stays upright. The desk places it under "Kelly"
     through the laptop's own transform — see `nameHint`. -->
@if (nameHint(); as hint) {
  <span
    class="name-hint"
    aria-hidden="true"
    [style.left.px]="hint.x"
    [style.top.px]="hint.y"
    [style.font-size.px]="hint.size"
    ><span class="name-hint-text">(click for 'about')</span></span
  >
}

<!-- Off the desk, the photo is scenery again: a veil drops so the frosted panels
     of every other page read against it. -->
<div class="veil" [class.is-lifted]="lifted()" aria-hidden="true"></div>
