<div
  class="p-3 rounded-2xl sm:rounded-l-none border border-gray-300 border-double"
>
  <div class="w-full">
    <div class="flex gap-2 items-baseline">
      <span class="text-l mr-2 text-white/90 print:text-gray-900">{{
        employer()
      }}</span>
      <span class="text-sm text-white/60 print:text-gray-500">{{
        location()
      }}</span>
      <span class="text-sm text-white/60 print:text-gray-500 ml-auto"
        >{{ startDate() | conditionalDate }} -
        {{ endDate() | conditionalDate }}</span
      >
    </div>
    <div>
      <span class="text-sm text-white/80 print:text-gray-900">{{ title() }}</span>
    </div>
  </div>
  <ul>
    @for (bullet of bullets(); track bullet) {
      <li class="text-xs text-white/60 print:text-gray-500">
        &nbsp;-{{ bullet }}
      </li>
    }
  </ul>
</div>
