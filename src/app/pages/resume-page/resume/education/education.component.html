<div
  class="p-3 rounded-2xl sm:rounded-l-none border border-gray-300 border-double w-full"
>
  <div class="flex gap-2 items-baseline text-base">
    <span class="mr-2 text-white/90 print:text-gray-900">{{ name() }}</span>
    <span class="text-white/60 print:text-gray-500 ml-auto text-sm"
      >{{ startDate() | conditionalDate }} -
      {{ endDate() | conditionalDate }}</span
    >
  </div>

  <div class="text-sm text-white/70 print:text-gray-700">
    {{ degree() }}
  </div>
</div>
